name: Portal-BSC CI

on:
  pull_request:
  push:
    branches:
      - 'codex/**'
      - 'copilot/**'
      - 'feature/**'
      - 'fix/**'
      - develop
      - development

permissions:
  contents: read

jobs:
  test:
    name: Node 22 tests and dependency integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      couchdb:
        image: couchdb:3
        env:
          COUCHDB_USER: ci-admin
          COUCHDB_PASSWORD: ci-only-password-not-for-production
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl --fail --silent http://localhost:5984/_up"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Initialize disposable CouchDB single-node service
        run: >-
          curl --fail --silent --show-error
          --user 'ci-admin:ci-only-password-not-for-production'
          --header 'Content-Type: application/json'
          --data '{"action":"enable_single_node","bind_address":"0.0.0.0","port":5984,"username":"ci-admin","password":"ci-only-password-not-for-production"}'
          http://127.0.0.1:5984/_cluster_setup
      - run: npm ci
        id: install
      - run: npm run typecheck
      - name: Unit and HTTP tests (must execute tests)
        run: npm test
      - run: npm run build
        id: build
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
      - name: Real Redis and CouchDB integration (must execute tests)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: npm run test:integration
        env:
          INTEGRATION_TESTS: '1'
          REDIS_URL: redis://127.0.0.1:6379
          COUCHDB_URL: http://ci-admin:ci-only-password-not-for-production@127.0.0.1:5984

      - name: Production security audit (block high and critical; report all findings)
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit and peer validation
        run: |
          npm audit --json
          npm ls --all

  windows-tooling:
    name: Node 22 Windows build, watch, and debugger lifecycle
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:tooling
      - name: Windows managed upload, filesystem, sharing and Office-format checks
        run: node --test --test-reporter=tap --require ts-node/register src/files/managed-upload.http.test.ts src/files/upload-types.test.ts src/files/project-formats.test.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --json
      - run: npm ls --all

  docker:
    name: Production image, Compose persistence, and startup smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: docker build --pull --target runtime --tag portal-bsc:ci .
      - name: Build restricted inherited-socket Nginx image (no publication)
        run: docker build --pull --file Dockerfile.nginx-socket --tag portal-nginx-socket:ci .
      - name: Production Compose persistence and container smoke tests
        run: npm run test:persistence
        env:
          INTEGRATION_TESTS: '1'

  docker24-socket:
    name: Docker 24.0.2 and Compose 2.20.1 Unix transport compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: docker build --file Dockerfile.nginx-socket --tag portal-nginx-socket:ci .
      - name: Test against disposable exact-version daemon and Compose client
        shell: bash
        run: |
          set -euo pipefail
          # Entirely disposable GitHub runner; no NAS or remote Docker endpoint.
          docker run --privileged -d --name portal-docker24 -e DOCKER_TLS_CERTDIR= \
            -v /tmp:/tmp -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -p 127.0.0.1::2375 docker:24.0.2-dind --tls=false
          trap 'docker rm -f portal-docker24 >/dev/null' EXIT
          endpoint="tcp://$(docker port portal-docker24 2375)"
          ready=false
          for attempt in $(seq 1 60); do
            if docker --host "$endpoint" info >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          test "$(docker --host "$endpoint" version --format '{{.Server.Version}}')" = 24.0.2
          docker save portal-nginx-socket:ci | docker --host "$endpoint" load
          DOCKER_HOST="$endpoint" node --test --test-reporter=tap --require ts-node/register test/persistence/unix-socket.test.ts
          config="$RUNNER_TEMP/portal-compose220"
          mkdir -p "$config/cli-plugins"
          cd "$config/cli-plugins"
          curl --fail --silent --show-error --location -O https://github.com/docker/compose/releases/download/v2.20.1/docker-compose-linux-x86_64
          curl --fail --silent --show-error --location -O https://github.com/docker/compose/releases/download/v2.20.1/docker-compose-linux-x86_64.sha256
          sha256sum -c docker-compose-linux-x86_64.sha256
          mv docker-compose-linux-x86_64 docker-compose
          chmod 700 docker-compose
          cd "$GITHUB_WORKSPACE"
          export DOCKER_CONFIG="$config" DOCKER_HOST="$endpoint"
          docker compose version
          test "$(docker compose version --short)" = 2.20.1
          # Normalize the full Unix base AND app overlay; detect every published
          # port, including ports inherited through an accidental unsafe merge.
          node --test --test-reporter=tap --require ts-node/register test/persistence/compose-isolation.test.ts
