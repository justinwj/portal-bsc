name: Portal-BSC CI

on:
  pull_request:
  push:
    branches:
      - 'codex/**'
      - 'copilot/**'
      - 'feature/**'
      - 'fix/**'
      - develop
      - development

permissions:
  contents: read

jobs:
  test:
    name: Node 22 tests and dependency integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      couchdb:
        image: couchdb:3
        env:
          COUCHDB_USER: ci-admin
          COUCHDB_PASSWORD: ci-only-password-not-for-production
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl --fail --silent http://localhost:5984/_up"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Initialize disposable CouchDB single-node service
        run: >-
          curl --fail --silent --show-error
          --user 'ci-admin:ci-only-password-not-for-production'
          --header 'Content-Type: application/json'
          --data '{"action":"enable_single_node","bind_address":"0.0.0.0","port":5984,"username":"ci-admin","password":"ci-only-password-not-for-production"}'
          http://127.0.0.1:5984/_cluster_setup
      - run: npm ci
        id: install
      - run: npm run typecheck
      - name: Unit and HTTP tests (must execute tests)
        run: npm test
      - run: npm run build
        id: build
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
      - name: Real Redis and CouchDB integration (must execute tests)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: npm run test:integration
        env:
          INTEGRATION_TESTS: '1'
          REDIS_URL: redis://127.0.0.1:6379
          COUCHDB_URL: http://ci-admin:ci-only-password-not-for-production@127.0.0.1:5984

      - name: Production security audit (block high and critical; report all findings)
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit and peer validation
        run: |
          npm audit --json
          npm ls --all

  windows-tooling:
    name: Node 22 Windows build, watch, and debugger lifecycle
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:tooling
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --json
      - run: npm ls --all

  docker:
    name: Production image, Compose persistence, and startup smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: docker build --pull --target runtime --tag portal-bsc:ci .
      - name: Production Compose persistence and container smoke tests
        run: npm run test:persistence
        env:
          INTEGRATION_TESTS: '1'
