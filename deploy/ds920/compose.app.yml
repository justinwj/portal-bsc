# REVIEW CANDIDATE: merge with the protected ORIGINAL portal project definition.
# This file deliberately does not redefine nginx, CouchDB, Redis or their mounts.
# Read docs/ds920-production-preparation.md before selecting it. Never use --remove-orphans.
services:
  app:
    image: ${PORTAL_APP_IMAGE:?Select the verified immutable locally loaded image}
    pull_policy: never
    platform: linux/amd64
    user: "${PORTAL_APP_UID:?Verify the non-root DSM UID}:${PORTAL_APP_GID:?Verify the non-root DSM GID}"
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      PORT: '3000'
      SESSION_SECRET: ${SESSION_SECRET:?Supply the protected session secret}
      ALLOW_IN_MEMORY_SESSION_STORE: 'false'
      COUCHDB_URL: ${PORTAL_COUCHDB_URL:?Verify the credential-free existing CouchDB network URL}
      COUCHDB_USER: ${COUCHDB_USER:?Verify the existing CouchDB administrator identity}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Supply the existing protected CouchDB credential}
      REDIS_URL: ${PORTAL_REDIS_URL:?Verify the existing Redis network URL and authentication policy}
      NAS_FILES_DIR: /var/lib/portal-bsc/files
      NAS_FILES_HOST_PATH: ${NAS_FILES_HOST_PATH:?Verify the existing legacy files bind source}
      PORTAL_UPLOADS_ENABLED: 'true'
      PORTAL_UPLOADS_DIR: /var/lib/portal-bsc/uploads
      PORTAL_UPLOADS_HOST_PATH: ${PORTAL_UPLOADS_HOST_PATH:?Verify the separate existing managed root}
      PORTAL_UPLOADS_STORAGE_ID: ${PORTAL_UPLOADS_STORAGE_ID:?Verify the marker and database storage identity}
      PORTAL_UPLOAD_MIN_FREE_BYTES: ${PORTAL_UPLOAD_MIN_FREE_BYTES:?Select physical disk headroom in bytes}
      PORTAL_UPLOAD_MAX_OBJECTS_PER_USER: ${PORTAL_UPLOAD_MAX_OBJECTS_PER_USER:-1000}
    volumes:
      - type: bind
        source: ${NAS_FILES_HOST_PATH:?Verify the existing legacy files bind source}
        target: /var/lib/portal-bsc/files
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PORTAL_UPLOADS_HOST_PATH:?Verify the separate existing managed root}
        target: /var/lib/portal-bsc/uploads
        read_only: false
        bind:
          create_host_path: false
    # Inherit the supplied original project's implicit default network.
    # Verify its live name/ID before deployment; do not create a parallel network.
    networks: [default]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
