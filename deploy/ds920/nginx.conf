# Complete replacement candidate, not a conf.d server snippet.
# TLS terminates here; DSM may optionally proxy HTTPS to this HTTPS listener.
# Preserve/review original host ports and log bind targets before adoption.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    default_type application/octet-stream;
    # Excludes query strings, cookies, Authorization and request bodies.
    log_format portal '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log portal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/portal-tls/tls.crt;
        ssl_certificate_key /etc/nginx/portal-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:portal:1m;
        ssl_session_timeout 10m;

        # Decimal bytes, aligned with the recommended 1 GB application maximum.
        # A later administrator increase also needs a reviewed proxy/DSM limit.
        client_max_body_size 1000000000;
        client_body_timeout 60s;
        send_timeout 60s;

        location / {
            # Runtime DNS refresh survives app container recreation.
            set $portal_upstream app:3000;
            proxy_pass http://$portal_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
