# UNSELECTED TLS alternative, not the replacement for the existing 8088:80 mapping.
# Use nginx.http-proposal.conf for the reconciled HTTP routing review.
# TLS topology, hostname, certificate management and proxy trust remain undecided.
# Preserve/review original host ports and log bind targets before adoption.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
# Inherit the original daemon's compiled PID path for safe in-place reloads.

events {
    worker_connections 512;
}

http {
    server_tokens off;
    default_type application/octet-stream;
    # Excludes query strings, cookies, Authorization and request bodies.
    log_format portal '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log portal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Requires nginx >= 1.27.3 for open-source upstream DNS resolution.
    # Keep completed responses reusable rather than closing the Node stream early.
    upstream portal_application {
        zone portal_application 64k;
        server app:3000 resolve;
        keepalive 8;
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/portal-tls/tls.crt;
        ssl_certificate_key /etc/nginx/portal-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:portal:1m;
        ssl_session_timeout 10m;

        # Decimal bytes, aligned with the recommended 1 GB application maximum.
        # A later administrator increase also needs a reviewed proxy/DSM limit.
        client_max_body_size 1000000000;
        client_body_timeout 60s;
        send_timeout 60s;

        location / {
            proxy_pass http://portal_application;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
