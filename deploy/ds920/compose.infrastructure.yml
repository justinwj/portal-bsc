# REVIEW REFERENCE reconciled with Justin's supplied original portal project.
# Do not apply this to recreate existing services. For a later app-only addition,
# use the protected ORIGINAL project file plus compose.app.yml, with -p portal.
# Differences from the original: protected required credentials and long binds
# that reject missing sources. Existing paths, identities, ports and commands stay.
services:
  nginx:
    image: nginx:stable-alpine
    container_name: portal-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - type: bind
        source: /volume1/docker/portal/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/docker/portal/files
        target: /srv/portal-files
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/docker/portal/logs
        target: /var/log/nginx
        read_only: false
        bind:
          create_host_path: false
    depends_on:
      - couchdb
      - redis

  couchdb:
    image: couchdb:3
    container_name: portal-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Privately verify the existing CouchDB administrator}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Supply the existing verified credential without rotation}
    volumes:
      - type: bind
        source: /volume1/docker/portal/couchdb/data
        target: /opt/couchdb/data
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/docker/portal/couchdb/config
        target: /opt/couchdb/etc/local.d
        read_only: false
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:5984:5984"

  redis:
    image: redis:7-alpine
    container_name: portal-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
