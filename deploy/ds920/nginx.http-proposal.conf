# Complete HTTP ROUTING proposal for the EXISTING portal-nginx container.
# Preserve the supplied original mapping 8088 -> 80 and all existing mounts.
# Owner inspection: DSM Reverse Proxy list is empty; no Portal rule is configured.
# HTTPS is NOT selected here. Production Secure-cookie login requires a separately
# reviewed HTTPS/trusted-proxy plan; never trust arbitrary forwarding claims.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
# Inherit the original daemon's compiled PID path for safe in-place reloads.

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/octet-stream;
    log_format portal '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log portal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Open-source dynamic upstream DNS requires nginx >= 1.27.3.
    upstream portal_application {
        zone portal_application 64k;
        server app:3000 resolve;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1000000000;
        client_body_timeout 60s;
        send_timeout 60s;

        location / {
            proxy_pass http://portal_application;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
