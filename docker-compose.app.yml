services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      COUCHDB_URL: http://couchdb:5984
      NAS_FILES_DIR: /var/lib/portal-bsc/files
    volumes:
      - ./data/files:/var/lib/portal-bsc/files
    depends_on:
      - redis
      - couchdb
    networks:
      - portal-net
    # For local testing only, uncomment the line below and run behind a reverse proxy in production.
    # ports:
    #   - "127.0.0.1:3000:3000"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    networks:
      - portal-net

  couchdb:
    image: couchdb:3
    networks:
      - portal-net

networks:
  portal-net:
    driver: bridge
