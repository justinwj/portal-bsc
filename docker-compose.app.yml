services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ALLOW_IN_MEMORY_SESSION_STORE: 'false'
      NAS_FILES_DIR: /var/lib/portal-bsc/files
    volumes:
      - ${NAS_FILES_HOST_PATH:-./data/files}:/var/lib/portal-bsc/files
    depends_on:
      redis:
        condition: service_healthy
      couchdb:
        condition: service_healthy
    networks:
      - portal-net
    # For local testing only, uncomment the line below and run behind a reverse proxy in production.
    # ports:
    #   - "127.0.0.1:3000:3000"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - portal-net

  couchdb:
    image: couchdb:3
    # The image's native user avoids root ownership changes on the read-only config mount.
    user: '5984:5984'
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./couchdb/single-node.ini:/opt/couchdb/etc/local.d/20-portal-single-node.ini:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - portal-net

networks:
  portal-net:
    driver: bridge

volumes:
  couchdb_data:
